<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rbaiforge apps — Privacy policies</title>
<meta name="description" content="Privacy policies for rbaiforge's Android apps.">
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5a5a5a; --rule: #e2e2e2; --accent: #1f6f5c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121212; --fg: #ececec; --muted: #a6a6a6; --rule: #2c2c2c; --accent: #7fd4bb; }
  }
  :root[data-theme="dark"] { --bg: #121212; --fg: #ececec; --muted: #a6a6a6; --rule: #2c2c2c; --accent: #7fd4bb; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); margin: 0; padding: 0 16px;
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 56px 0 96px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 24px; letter-spacing: -0.02em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  a { color: var(--accent); font-weight: 600; }
  .note { color: var(--muted); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Privacy policies</h1>
  <ul>
    <li><a href="readkeep/">ReadKeep</a> <span class="note">— read, listen and track your reading</span></li>
    <li><a href="reactcam/">ReactCam</a> <span class="note">— record reactions with captions</span></li>
  </ul>
  <footer>Questions: <a href="mailto:rbaiforge@gmail.com">rbaiforge@gmail.com</a></footer>
</main>
</body>
</html>
